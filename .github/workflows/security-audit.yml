name: Legacy dependency security audit

on:
  push:
    branches:
      - agent/security-audit
    paths:
      - .github/workflows/security-audit.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out locked project
        uses: actions/checkout@v4
        with:
          ref: agent/security-audit
          fetch-depth: 0

      - name: Set up Node.js 14
        uses: actions/setup-node@v4
        with:
          node-version: 14

      - name: Use npm 8
        run: npm install --global npm@8.19.4

      - name: Install locked tree
        id: install
        continue-on-error: true
        run: |
          set -o pipefail
          npm ci 2>&1 | tee .security-install.log

      - name: Baseline build
        id: build
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          npm run build 2>&1 | tee .security-build.log

      - name: Audit locked tree
        if: steps.install.outcome == 'success'
        run: npm audit --json > .security-audit.json || true

      - name: Summarize audit
        if: steps.install.outcome == 'success'
        run: |
          node <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('.security-audit.json', 'utf8'));
          const wanted = new Set(['critical', 'high', 'moderate']);
          const findings = Object.entries(report.vulnerabilities || {})
            .filter(([, value]) => wanted.has(value.severity))
            .map(([name, value]) => ({
              name,
              severity: value.severity,
              direct: Boolean(value.isDirect),
              range: value.range,
              via: (value.via || []).map(item => typeof item === 'string' ? item : item.title),
              fixAvailable: value.fixAvailable
            }));
          fs.writeFileSync('.security-audit-summary.json', JSON.stringify({
            counts: report.metadata && report.metadata.vulnerabilities || {},
            findings
          }, null, 2) + '\n');
          NODE

      - name: Record baseline audit
        if: always()
        run: |
          printf 'install=%s\nbuild=%s\n' "${{ steps.install.outcome }}" "${{ steps.build.outcome }}" > .security-audit-status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .security-audit-status.txt
          for file in .security-install.log .security-build.log .security-audit-summary.json; do
            if [ -f "$file" ]; then
              git add "$file"
            fi
          done
          git commit -m "Record legacy dependency security audit"
          git push origin HEAD:agent/security-audit

      - name: Fail if locked install or build failed
        if: always() && (steps.install.outcome != 'success' || steps.build.outcome != 'success')
        run: exit 1
